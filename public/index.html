<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="/manifest.json"><title>IA-REMEMBER</title><link rel="icon" href="logo.jpg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#111;color:#f2f2f2;font-family:Rubik,system-ui,sans-serif;overflow:hidden}button,input{font:inherit}#app{width:100%;height:100%;background:#111}.screen{position:absolute;inset:0;display:none}.screen.active{display:flex}.home{align-items:center;justify-content:center;padding:28px}.home-card{width:min(380px,100%);text-align:center}.logo{width:72px;height:72px;border-radius:22px;object-fit:cover;border:1px solid #292929;margin-bottom:25px}.brand{font-size:22px;font-weight:800;letter-spacing:.02em}.tagline{margin:9px 0 34px;color:#777;font-size:12px}.start{width:100%;height:52px;border:1px solid #eee;border-radius:26px;background:#eee;color:#111;font-weight:700;font-size:12px;letter-spacing:.08em}.start:active,.answer-btn:active{transform:scale(.98)}.game{flex-direction:column}.game-header{height:64px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 17px;border-bottom:1px solid #292929;background:#191919}.game-title{font-size:14px;font-weight:800}.stats{font-size:11px;color:#aaa}.game-body{flex:1;min-height:0;overflow-y:auto;padding:30px 18px 35px}.game-inner{width:min(520px,100%);margin:auto}.narrator{font-size:14px;line-height:1.55;color:#bdbdbd;margin-bottom:30px}.label{font-size:10px;color:#666;text-transform:uppercase;letter-spacing:.15em;font-weight:700;margin-bottom:10px}.question{font-size:22px;line-height:1.3;font-weight:700;margin-bottom:22px}.answer{width:100%;min-height:54px;resize:none;background:#191919;border:1px solid #363636;border-radius:27px;color:#f2f2f2;padding:15px 18px;outline:0;font-size:14px}.answer:focus{border-color:#666}.answer-btn{width:100%;height:50px;margin-top:12px;border:0;border-radius:25px;background:#eee;color:#111;font-size:11px;font-weight:800;letter-spacing:.08em}.hint{min-height:18px;margin-top:14px;color:#777;font-size:11px;text-align:center}.result{margin-top:22px;padding:17px;border:1px solid #292929;border-radius:18px;background:#191919;font-size:13px;line-height:1.5}.result strong{display:block;margin-bottom:5px;font-size:15px}.result.ok strong{color:#eee}.result.bad strong{color:#999}.next{margin-top:12px;background:#242424;color:#eee;border:1px solid #333}.back{position:fixed;top:14px;left:14px;z-index:5;width:34px;height:34px;border:1px solid #333;border-radius:50%;background:#191919;color:#aaa}.loading{align-items:center;justify-content:center}.loading img{width:72px;height:72px;border-radius:22px}.loading p{font-size:10px;color:#666;letter-spacing:.2em;margin-top:15px}</style></head><body><main id="loading" class="screen active loading"><div><img src="logo.jpg" alt=""><p>CARGANDO</p></div></main><main id="home" class="screen home"><div class="home-card"><img class="logo" src="logo.jpg" alt="IA-REMEMBER"><div class="brand">IA-REMEMBER</div><div class="tagline">¿Cuánto recuerdas de nuestra historia?</div><button id="start" class="start">COMENZAR JUEGO</button></div></main><main id="game" class="screen game"><header class="game-header"><div class="game-title">IA-REMEMBER</div><div class="stats">Ronda <span id="round">1</span> · <span id="score">0</span> pts</div></header><button id="back" class="back" aria-label="Volver">‹</button><section class="game-body"><div class="game-inner"><div id="narrator" class="narrator"></div><div class="label" id="typeLabel">RECUERDO</div><div id="question" class="question"></div><input id="answer" class="answer" autocomplete="off" placeholder="Escribe tu respuesta..."><button id="answerBtn" class="answer-btn">RESPONDER</button><div id="hint" class="hint"></div><div id="result" class="result" hidden></div></div></section></main><script>const loading=document.getElementById('loading'),home=document.getElementById('home'),game=document.getElementById('game'),start=document.getElementById('start'),back=document.getElementById('back'),narrator=document.getElementById('narrator'),question=document.getElementById('question'),answer=document.getElementById('answer'),answerBtn=document.getElementById('answerBtn'),result=document.getElementById('result'),hint=document.getElementById('hint'),round=document.getElementById('round'),score=document.getElementById('score'),typeLabel=document.getElementById('typeLabel');let gameId=null,busy=false;const labels={date:'FECHA',complete:'COMPLETA EL RECUERDO',who:'¿QUIÉN?',event:'RECUERDO'};async function session(){try{const r=await fetch('/api/session',{credentials:'same-origin',cache:'no-store'});const d=await r.json();return d.authenticated}catch(e){return false}}function show(el){[loading,home,game].forEach(x=>x.classList.remove('active'));el.classList.add('active')}function render(data){gameId=data.gameId||gameId;round.textContent=data.round||1;score.textContent=data.score||0;narrator.textContent=data.narration||'Vamos a comprobar cuánto recuerdas...';question.textContent=data.question||'';hint.textContent=data.hint||'';typeLabel.textContent=labels[data.type]||'RECUERDO';answer.value='';result.hidden=true;answer.disabled=false;answerBtn.disabled=false;answer.focus()}async function startGame(){if(busy)return;busy=true;start.disabled=true;try{const r=await fetch('/api/game/start',{method:'POST',credentials:'same-origin'});const d=await r.json();if(!r.ok)throw new Error(d.error||'No se pudo iniciar');show(game);render(d)}catch(e){alert(e.message)}finally{busy=false;start.disabled=false}}async function submit(){const text=answer.value.trim();if(!text||busy||!gameId)return;busy=true;answerBtn.disabled=true;answer.disabled=true;try{const r=await fetch('/api/game/answer',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({gameId,answer:text})});const d=await r.json();if(!r.ok)throw new Error(d.error||'No se pudo comprobar');result.hidden=false;result.className='result '+(d.correct?'ok':'bad');result.innerHTML='<strong>'+(d.correct?'✓ CORRECTO':'✕ NO ERA ESA')+'</strong>'+d.explanation+'<br><br><b>Respuesta:</b> '+escapeHtml(d.correctAnswer);score.textContent=d.score;round.textContent=d.round;narrator.textContent=d.narration;question.textContent=d.question;hint.textContent=d.hint||'';typeLabel.textContent=labels[d.type]||'RECUERDO';answer.value='';answer.disabled=false;answerBtn.disabled=false;answer.focus()}catch(e){result.hidden=false;result.className='result bad';result.textContent=e.message;answer.disabled=false;answerBtn.disabled=false}finally{busy=false}}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}start.addEventListener('click',startGame);answerBtn.addEventListener('click',submit);answer.addEventListener('keydown',e=>{if(e.key==='Enter')submit()});back.addEventListener('click',()=>{gameId=null;show(home)});window.addEventListener('load',async()=>{if(!(await session())){location.replace('/');return}setTimeout(()=>show(home),500)});</script></body></html>
