<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><meta name="theme-color" content="#111111"><meta name="mobile-web-app-capable" content="yes"><meta name="application-name" content="RIVEROSIMITATION"><link rel="manifest" href="/manifest.json"><title>RIVEROSIMITATION</title><link rel="icon" href="logo.jpg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;height:100%;background:#111;color:#f2f2f2;font-family:'Rubik',system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden;overscroll-behavior:none}button,input{font:inherit}#app{position:relative;width:100%;height:100%;background:#111}#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#111;z-index:50;transition:opacity .5s}#loading img{width:92px;height:92px;object-fit:cover;border-radius:50%}#loading .loading-text{margin-top:18px;color:#777;font-size:12px;letter-spacing:.22em;font-weight:600}#picker{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;padding:calc(48px + env(safe-area-inset-top)) 22px 28px;text-align:center;background:#111}.picker-title{margin:0;font-size:19px;font-weight:800;letter-spacing:.02em;color:#f5f5f5}.sub{margin:7px 0 0;font-size:12px;color:#777}.profile-stage{position:relative;width:min(86vw,330px);height:min(92vw,370px);margin-top:40px;display:flex;align-items:center;justify-content:center;touch-action:pan-y;user-select:none}.profile-card{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .18s ease,opacity .18s ease}.profile-card.swiping-left{transform:translateX(-18px);opacity:.7}.profile-card.swiping-right{transform:translateX(18px);opacity:.7}.avatar{width:min(68vw,250px);height:min(68vw,250px);border-radius:50%;object-fit:cover;display:block;border:1px solid #292929}.profile-name{margin-top:25px;font-size:21px;font-weight:800;color:#f5f5f5}.profile-code{margin-top:6px;font-size:12px;color:#777;letter-spacing:.08em}.rotate-btn{margin-top:22px;width:52px;height:40px;border:1px solid #333;border-radius:22px;background:#242424;color:#eee;display:flex;align-items:center;justify-content:center;font-size:24px;line-height:1;cursor:pointer;transition:.15s}.rotate-btn:active{transform:scale(.96);background:#303030}.dots{display:flex;gap:7px;margin-top:18px}.dot{width:5px;height:5px;border-radius:50%;background:#444}.dot.active{background:#eee}#chat{position:fixed;inset:0;width:100%;height:100vh;height:100svh;display:none;flex-direction:column;background:#111;overflow:hidden}#chat-header{position:relative;z-index:2;flex:none;display:flex;align-items:center;gap:11px;padding:10px 14px calc(10px + env(safe-area-inset-top));background:#191919;border-bottom:1px solid #292929}#chat-header .back{width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:#aaa;cursor:pointer;font-size:29px;line-height:1;border-radius:50%;transition:.15s}#chat-header .back:active{background:#252525}.header-avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;flex:none}.who-wrap{min-width:0;display:flex;align-items:center;text-align:left}.who{font-weight:800;font-size:18px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#f5f5f5}.who-sub{display:none}#messages{flex:1;min-height:0;overflow-y:auto;padding:17px 14px 110px;display:flex;flex-direction:column;gap:12px;background:#111}.bubble{max-width:82%;font-size:14.5px;line-height:1.45;word-wrap:break-word;white-space:pre-wrap}.bubble.them{align-self:flex-start;background:transparent;color:#d1d1d1;border:0;border-radius:0;padding:2px 0}.bubble.me{align-self:flex-end;background:#242424;color:#f2f2f2;border:1px solid #363636;border-radius:18px;padding:9px 13px;border-bottom-right-radius:6px}.bubble.error{color:#999}.bubble.typing-in{opacity:0;transform:translateX(18px);animation:messageIn .32s ease-out forwards}@keyframes messageIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:translateX(0)}}#composer{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;align-items:center;gap:8px;padding:9px 10px calc(9px + env(safe-area-inset-bottom));background:#191919;border-top:1px solid #292929}#composer input{flex:1;min-width:0;height:46px;background:#242424;border:1px solid #3b3b3b;border-radius:24px;padding:0 16px;color:#f2f2f2;font-size:14px;outline:0}#composer input:focus{border-color:#666}#composer input::placeholder{color:#777}#composer button{width:46px;height:46px;border:1px solid #444;border-radius:50%;background:#eee;color:#111;cursor:pointer;font-size:0;display:flex;align-items:center;justify-content:center;transition:.15s}#composer button::before{content:'➤';font-size:19px;transform:translate(-1px,1px)}#composer button:active{transform:scale(.95)}#composer button:disabled{opacity:.45}::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:#444;border-radius:4px}
</style></head><body><div id="app"><div id="loading"><img src="logo.jpg" alt="logo"><div class="loading-text">CARGANDO</div></div><section id="picker" aria-label="Selecciona ChatIA"><h1 class="picker-title">RIVEROSIMITATION</h1><p class="sub">Selecciona ChatIA</p><div class="profile-stage" id="profileStage"><div class="profile-card" id="profileCard"><img class="avatar" id="profileImage" src="mavc.jpg" alt="Maria Villalba"><div class="profile-name" id="profileName">Maria Villalba</div><div class="profile-code" id="profileCode">M</div></div></div><button class="rotate-btn" id="rotateBtn" type="button" aria-label="Cambiar ChatIA">↔</button><div class="dots"><span class="dot active" id="dotM"></span><span class="dot" id="dotR"></span></div></section><section id="chat"><header id="chat-header"><div class="back" id="backBtn" aria-label="Volver">‹</div><img class="header-avatar" id="headerAvatar" src="mavc.jpg" alt=""><div class="who-wrap"><div class="who" id="whoLabel">Maria Villalba</div><div class="who-sub" id="whoSub">M</div></div></header><div id="messages"></div><div id="composer"><input id="input" type="text" placeholder="Escribe un mensaje" autocomplete="off"><button id="sendBtn" type="button" aria-label="Enviar"></button></div></section></div><script>
const loading=document.getElementById('loading'),picker=document.getElementById('picker'),chat=document.getElementById('chat'),messagesEl=document.getElementById('messages'),input=document.getElementById('input'),sendBtn=document.getElementById('sendBtn'),backBtn=document.getElementById('backBtn'),profileStage=document.getElementById('profileStage'),profileCard=document.getElementById('profileCard'),profileImage=document.getElementById('profileImage'),profileName=document.getElementById('profileName'),profileCode=document.getElementById('profileCode'),rotateBtn=document.getElementById('rotateBtn'),headerAvatar=document.getElementById('headerAvatar'),whoLabel=document.getElementById('whoLabel'),dotM=document.getElementById('dotM'),dotR=document.getElementById('dotR');const profiles={M:{image:'mavc.jpg',name:'Maria Villalba',code:'M'},R:{image:'riverojsx.jpg',name:'Carlos Rivero',code:'R'}};let selected='M',history=[],typingTimer=null;async function ensureSession(){try{const r=await fetch('/api/session',{credentials:'same-origin',cache:'no-store'}),d=await r.json();if(!d.authenticated){location.replace('/');return false}return true}catch(e){return false}}function updateProfile(){const p=profiles[selected];profileImage.src=p.image;profileImage.alt=p.name;profileName.textContent=p.name;profileCode.textContent=p.code;dotM.classList.toggle('active',selected==='M');dotR.classList.toggle('active',selected==='R')}function rotate(direction){const next=direction==='left'?'R':'M';if(next===selected)return;profileCard.classList.add(direction==='left'?'swiping-left':'swiping-right');setTimeout(()=>{selected=next;updateProfile();profileCard.classList.remove('swiping-left','swiping-right')},140)}function openChat(){const p=profiles[selected];clearTimeout(typingTimer);history=[];messagesEl.innerHTML='';headerAvatar.src=p.image;headerAvatar.alt=p.name;whoLabel.textContent=p.name;picker.style.display='none';chat.style.display='flex';input.focus()}function addBubble(text,who,animate=false){const div=document.createElement('div');div.className='bubble '+who+(animate?' typing-in':'');messagesEl.appendChild(div);messagesEl.scrollTop=messagesEl.scrollHeight;if(animate&&who==='them')revealText(div,text);else div.textContent=text;return div}function getCharDelay(char){if(char==='\n')return 90;if(/[.!?]/.test(char))return 70;if(/[,;:]/.test(char))return 48;if(char===' ')return 22;return 34}function revealText(element,text){const chars=Array.from(String(text));let index=0;clearTimeout(typingTimer);element.textContent='';const write=()=>{if(index>=chars.length){typingTimer=null;element.classList.remove('typing-in');return}element.textContent+=chars[index];index++;messagesEl.scrollTop=messagesEl.scrollHeight;typingTimer=setTimeout(write,getCharDelay(chars[index-1]))};write()}async function sendMessage(){const text=input.value.trim();if(!text||!selected)return;input.value='';sendBtn.disabled=true;addBubble(text,'me');history.push({role:'user',content:text});try{const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({persona:selected,messages:history})});if(res.status===401){location.replace('/');return}const data=await res.json();if(data.reply){addBubble(data.reply,'them',true);history.push({role:'assistant',content:data.reply})}else addBubble(data.error||'Disculpa, experimenté un error de conexión.','them',false)}catch(e){addBubble('Disculpa, experimenté un error de conexión.','them',false)}sendBtn.disabled=false;input.focus()}rotateBtn.addEventListener('click',()=>rotate(selected==='M'?'left':'right'));profileStage.addEventListener('click',e=>{if(e.target.closest('#rotateBtn'))return;if(e.target.closest('.profile-card'))openChat()});backBtn.addEventListener('click',()=>{clearTimeout(typingTimer);typingTimer=null;chat.style.display='none';picker.style.display='flex';input.value='';updateProfile()});sendBtn.addEventListener('click',sendMessage);input.addEventListener('keydown',e=>{if(e.key==='Enter')sendMessage()});let touchStartX=0,touchStartY=0;profileStage.addEventListener('touchstart',e=>{const t=e.changedTouches[0];touchStartX=t.clientX;touchStartY=t.clientY},{passive:true});profileStage.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-touchStartX,dy=t.clientY-touchStartY;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy))rotate(dx<0?'left':'right');else if(Math.abs(dx)<12&&Math.abs(dy)<12)openChat()},{passive:true});window.addEventListener('load',async()=>{if(!(await ensureSession()))return;setTimeout(()=>{loading.style.opacity='0';setTimeout(()=>{loading.style.display='none';picker.style.display='flex'},500)},450)});
</script></body></html>
