<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111"><title>riverojsx</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#09090b;color:#eee;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{min-height:100dvh;display:grid;place-items:center;padding:18px}.card{width:min(520px,100%);background:#151518;border:1px solid #29292e;border-radius:24px;padding:24px;box-shadow:0 20px 60px #0008}.hidden{display:none!important}h1{margin:0 0 8px;font-size:30px}.muted{color:#9b9ba3}.input{width:100%;padding:15px;border-radius:14px;border:1px solid #38383f;background:#0e0e10;color:white;font-size:16px;margin:14px 0}.btn{width:100%;border:0;border-radius:14px;padding:15px;background:#fff;color:#111;font-weight:800;font-size:16px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.move{border:1px solid #36363d;background:#1d1d21;color:#fff;border-radius:18px;padding:18px 8px;font-size:28px;cursor:pointer}.move span{display:block;font-size:13px;margin-top:7px}.status{margin:16px 0;padding:14px;border-radius:14px;background:#101014;color:#cfcfd5;text-align:center}.players{display:grid;gap:8px;margin-top:14px}.player{display:flex;justify-content:space-between;padding:11px 13px;background:#101014;border-radius:12px}.champ{font-size:34px;font-weight:900;text-align:center;padding:28px 0}.error{color:#ff8d8d;margin-top:10px;font-size:14px}</style></head><body><section id="login" class="card"><h1>IA-remember</h1><div class="muted">Inicia sesión con tu nickname</div><input id="nickname" class="input" maxlength="20" placeholder="Tu nickname"><button id="loginBtn" class="btn">Iniciar sesión</button><div id="loginError" class="error"></div></section>
<section id="home" class="card hidden"><h1>Hola, <span id="homeNick"></span> 👋</h1><p class="muted">Selecciona un modo.</p><button id="rpsBtn" class="btn">🪨 Piedra, Papel o Tijera</button></section>
<section id="game" class="card hidden"><h1>🪨 Piedra, Papel o Tijera</h1><div id="gameBody"></div></section>
<script>
let token=localStorage.getItem('ia_token');
const $=x=>document.getElementById(x);
function show(x){['login','home','game'].forEach(id=>$(id).classList.toggle('hidden',id!==x))}
async function api(url,opt){const r=await fetch(url,opt);const d=await r.json();if(!r.ok)throw Error(d.error||'Error');return d}
async function login(){try{const d=await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nickname:$('nickname').value})});token=d.token;localStorage.setItem('ia_token',token);$('homeNick').textContent=d.nickname;show('home')}catch(e){$('loginError').textContent=e.message}}
async function queue(){show('game');$('gameBody').innerHTML='<div class="status">🔎 Buscando partida…<br><br>Se necesitan 4 jugadores.<br><b>El servidor los emparejará automáticamente.</b></div>';try{await api('/api/queue',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});state()}catch(e){$('gameBody').innerHTML='<div class="error">'+e.message+'</div>'}}
async function leaveTournament(){try{await api('/api/leave',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});show('home')}catch(e){alert(e.message)}}
async function move(m){try{await api('/api/move',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,move:m})});state()}catch(e){alert(e.message)}}
function render(d){if(d.phase==='idle'){show('home');return}show('game');let h='';
if(d.phase==='round'||d.phase==='final'){h+='<div class="status"><b>'+(d.phase==='final'?'🏆 FINAL':'Ronda '+d.round+' de 3')+'</b></div>';if(d.current){h+='<div class="status">Rival: <b>'+d.current.opponent+'</b><br>'+(d.current.chosen?'Movimiento enviado. Esperando…':'Elige tu movimiento')+'</div>';h+='<div class="grid">'+['piedra','papel','tijera'].map(x=>'<button class="move" onclick="move(\''+x+'\')" '+(d.current.chosen?'disabled':'')+'>'+({piedra:'🪨',papel:'📄',tijera:'✂️'}[x])+'<span>'+x+'</span></button>').join('')+'</div>'}else h+='<div class="status">Esperando tu próximo enfrentamiento…</div>'}
else if(d.phase==='champion')h='<div class="champ">🏆<br>'+d.champion+'<br><small>CAMPEÓN</small></div><button class="btn" onclick="leaveTournament()">Volver a buscar partida</button>';
h+='<h3>Clasificación</h3><div class="players">'+d.standings.map((p,i)=>'<div class="player"><span>'+(i+1)+'. '+p.nickname+'</span><b>'+p.wins+' W</b></div>').join('')+'</div>';$('gameBody').innerHTML=h}
async function state(){if(!token)return;try{render(await api('/api/state?token='+encodeURIComponent(token)))}catch(e){localStorage.removeItem('ia_token');token=null;show('login')}}
$('loginBtn').onclick=login;$('nickname').onkeydown=e=>{if(e.key==='Enter')login()};$('rpsBtn').onclick=queue;
if(token)state();else show('login');
setInterval(async()=>{if(token){fetch('/api/ping',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})}).catch(()=>{});state()}},1200);
</script></body></html>
