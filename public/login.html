<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111111"><meta name="mobile-web-app-capable" content="yes"><meta name="application-name" content="RIVEROSIMITATION"><link rel="manifest" href="/manifest.json"><title>RIVEROSIMITATION · Acceso</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#111;color:#f5f5f5;font-family:'Rubik',system-ui,sans-serif;overscroll-behavior:none}body{min-height:100dvh;display:grid;place-items:center;padding:20px}.access{width:min(360px,90vw);display:flex;flex-direction:column;align-items:center;padding:38px 28px 30px;background:#191919;border:1px solid #292929;border-radius:30px;box-shadow:0 20px 55px rgba(0,0,0,.35)}.logo{width:66px;height:66px;border-radius:20px;object-fit:cover;margin-bottom:20px}.title{font-size:17px;font-weight:800;margin-bottom:6px;color:#fff}.subtitle{font-size:11px;color:#858585;margin-bottom:28px}.password-wrap{width:100%;display:flex;flex-direction:column;align-items:center}.password-label{width:100%;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#777;margin-bottom:9px;text-align:center}.password-row{width:100%;height:58px;display:flex;align-items:center;justify-content:center;background:#111;border:1px solid #333;border-radius:29px;transition:border-color .2s,box-shadow .2s}.password-row:focus-within{border-color:#666;box-shadow:0 0 0 3px rgba(255,255,255,.05)}.password-row input{width:100%;height:100%;background:transparent;border:0;outline:0;color:#fff;text-align:center;font-size:21px;font-weight:500;letter-spacing:.45em;padding:0 7px 0 14px;border-radius:29px}.password-row input::placeholder{color:#555;letter-spacing:.15em}.verify{margin-top:20px;width:100%;height:48px;border:0;border-radius:24px;background:#f2f2f2;color:#111;font:700 12px 'Rubik',system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.verify:active{transform:scale(.98)}.verify:disabled{opacity:.45}.msg{height:17px;margin-top:12px;font:10px 'Rubik',system-ui,sans-serif;color:#777;text-align:center}.msg.error{color:#888}.msg.ok{color:#fff;font-weight:500}</style></head><body><main class="access"><img class="logo" src="logo.jpg" alt="RIVEROSIMITATION"><div class="title">RIVEROSIMITATION</div><div class="subtitle">Acceso privado</div><div class="password-wrap"><div class="password-label">Contraseña</div><form id="form" class="password-row"><input id="password" type="password" inputmode="numeric" pattern="[0-9]{14}" minlength="14" maxlength="14" autocomplete="current-password" aria-label="Contraseña de acceso" placeholder="••••••••••••••" autofocus required></form></div><button class="verify" id="verify" type="button">Entrar</button><div id="msg" class="msg"></div></main><script>const form=document.getElementById('form'),input=document.getElementById('password'),verify=document.getElementById('verify'),msg=document.getElementById('msg');async function check(){try{const r=await fetch('/api/session',{credentials:'same-origin',cache:'no-store'}),d=await r.json();if(d.authenticated)location.replace('/')}catch(e){}}async function login(){const password=input.value;if(password.length!==14||/\D/.test(password)){msg.className='msg error';msg.textContent='14 dígitos requeridos';return}verify.disabled=true;msg.className='msg';msg.textContent='';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({password})}),d=await r.json();if(!r.ok){msg.className='msg error';msg.textContent=d.error||'ACCESO DENEGADO';input.select();verify.disabled=false;return}msg.className='msg ok';msg.textContent='ACCESO CONCEDIDO';setTimeout(()=>location.replace('/'),150)}catch(e){msg.className='msg error';msg.textContent='ERROR DE CONEXIÓN';verify.disabled=false}}form.addEventListener('submit',e=>{e.preventDefault();login()});verify.addEventListener('click',login);input.addEventListener('input',()=>{input.value=input.value.replace(/\D/g,'').slice(0,14)});input.addEventListener('keydown',e=>{if(e.key==='Enter')login()});check();</script></body></html>
