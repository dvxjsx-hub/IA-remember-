services:
  - type: web
    name: ia-remember
    env: node
    buildCommand: npm install && npm run index-memory
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ACCESS_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
